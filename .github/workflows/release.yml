# Release workflow: main is the release line.
#
# Every push to main re-runs the full CI matrix; if it passes, the script is
# published as a GitHub Release (tag v<VERSION>) with its SHA-256 checksum
# and the CI compliance reports for Debian 12/13, Ubuntu 22.04/24.04/26.04,
# Rocky Linux and AlmaLinux 8/9/10 and CentOS Stream 9/10.
# A VERSION that is already released is skipped, never overwritten.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: read and verify version
        id: version
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          script_version=$(sed -n 's/^readonly SCRIPT_VERSION="\(.*\)"$/\1/p' harden-and-audit.sh)
          if [[ "$version" != "$script_version" ]]; then
            echo "::error::VERSION ($version) != SCRIPT_VERSION in harden-and-audit.sh ($script_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released; bump VERSION to publish a new release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: download CI reports
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scap-*
          path: reports

      - name: build release assets
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 harden-and-audit.sh dist/harden-and-audit.sh
          (cd dist && sha256sum harden-and-audit.sh > harden-and-audit.sh.sha256)
          for d in reports/scap-*; do
            v=${d##*/scap-}
            for f in scap-report.html scap-summary.txt scap-report-anssi_bp28_high.html scap-report-stig.html; do
              [[ -f "$d/$f" ]] && cp "$d/$f" "dist/${v}-${f}"
            done
          done
          {
            echo "## linux-minimal-secure (harden-and-audit.sh) v${VERSION}"
            echo
            echo "FIPS-ready, CIS Level 2 hardened headless server transformation with an OpenSCAP self-audit. The distribution is detected: Debian 12 / 13, Ubuntu 22.04 / 24.04 / 26.04, and the RHEL family (RHEL, CentOS Stream, Rocky Linux, AlmaLinux, Oracle Linux 8 / 9 / 10)."
            echo
            echo "### Install"
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/harden-and-audit.sh"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/harden-and-audit.sh.sha256"
            echo "sha256sum -c harden-and-audit.sh.sha256 && sudo bash harden-and-audit.sh"
            echo '```'
            echo
            echo "### CI compliance results (this commit)"
            for s in reports/scap-*/summary.md; do
              [[ -f "$s" ]] && { cat "$s"; echo; }
            done
            echo
            echo "See docs/EXCEPTIONS.md for the documented, owner-approved deviations."
          } > dist/RELEASE_NOTES.md
          ls -la dist

      - name: create GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          v=v${VERSION}
          gh release create "$v" \
            --target "$GITHUB_SHA" \
            --title "linux-minimal-secure $v" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/harden-and-audit.sh dist/harden-and-audit.sh.sha256 dist/*-scap-*.html dist/*-scap-*.txt
