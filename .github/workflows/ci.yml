# CI for harden-and-audit.sh
#
# Runs on every push / PR to the integration branch (the default branch), and
# is reused by the release workflow on main. Each Debian / Ubuntu release is
# hardened inside a systemd-booted container that OpenSCAP evaluates as a real
# machine, then gated on CIS Level 2 Server >= 90%. ANSSI BP-028 High
# (Debian) and the DISA STIG (Ubuntu) are reported for information.
name: ci

on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Distinct prefix: when called from release.yml, github.workflow is the
# caller's name, and sharing the caller's group would deadlock.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash syntax
        run: |
          for f in harden-and-audit.sh tests/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 \
            -x --severity=warning harden-and-audit.sh tests/run-ci.sh tests/assertions.sh tests/container-init.sh

  harden-and-scan:
    name: ${{ matrix.distro }} ${{ matrix.version }} - harden + SCAP
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian, version: "12",    tag: debian12 }
          - { distro: debian, version: "13",    tag: debian13 }
          - { distro: ubuntu, version: "22.04", tag: ubuntu2204 }
          - { distro: ubuntu, version: "24.04", tag: ubuntu2404 }
          - { distro: ubuntu, version: "26.04", tag: ubuntu2604 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: harden, assert, re-run (idempotence), scan, gate
        env:
          CI_PRIVILEGED: "1"
          SCAP_MIN_SCORE: "90"
          OUT_DIR: ${{ github.workspace }}/artifacts/${{ matrix.tag }}
        run: tests/run-ci.sh "${{ matrix.distro }}" "${{ matrix.version }}"

      - name: upload SCAP reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scap-${{ matrix.tag }}
          path: artifacts/${{ matrix.tag }}
          if-no-files-found: warn
          retention-days: 90
